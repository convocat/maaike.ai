<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Body font preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;600;700&family=Roboto:wght@400;500;700&family=Source+Sans+3:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=Lato:wght@400;500;700&family=Atkinson+Hyperlegible:wght@400;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  body {
    margin: 0;
    background: #FFFFFF;
    color: #1A1A1A;
  }
  .tabs {
    position: sticky; top: 0; z-index: 10;
    display: flex; gap: 0;
    background: #FFFFFF;
    border-bottom: 1px solid #E5DFD4;
    padding: 8px 16px 0;
    font-family: 'Inter', system-ui, sans-serif;
    flex-wrap: wrap;
  }
  .tab {
    border: 1px solid transparent;
    border-bottom: none;
    background: transparent;
    padding: 10px 16px 12px;
    font: inherit; font-size: 13px;
    cursor: pointer; color: #7A7268;
    border-radius: 6px 6px 0 0;
    margin-right: 2px;
    position: relative; top: 1px;
  }
  .tab.is-active {
    background: #FFFFFF;
    border-color: #E5DFD4;
    color: #1A1A1A; font-weight: 600;
  }
  .meta {
    font-family: 'Inter', system-ui, sans-serif;
    font-size: 12px; color: #7A7268;
    padding: 8px 16px;
    background: #FFFFFF;
    border-bottom: 1px solid #E5DFD4;
  }
  iframe {
    display: block; width: 100%;
    height: calc(100vh - 84px);
    border: none; background: #FFFFFF;
  }
</style>
</head>
<body>

<div class="tabs">
  <button class="tab is-active" data-font='"Roboto", -apple-system, sans-serif'>Roboto (current)</button>
  <button class="tab" data-font='"Source Sans 3", -apple-system, sans-serif'>Source Sans 3</button>
  <button class="tab" data-font='"IBM Plex Sans", -apple-system, sans-serif'>IBM Plex Sans</button>
  <button class="tab" data-font='"Lato", -apple-system, sans-serif'>Lato</button>
  <button class="tab" data-font='"Atkinson Hyperlegible", -apple-system, sans-serif'>Atkinson Hyperlegible</button>
  <button class="tab" data-font='"Inter", -apple-system, sans-serif'>Inter</button>
</div>

<div class="meta">Article: <a href="#" id="open-tab" style="color:#3E5638; text-decoration:none">/articles/garden-as-metaphor/ ↗</a> &middot; body font swaps live in the iframe; headings stay Lora.</div>

<iframe id="frame" src="/articles/garden-as-metaphor/"></iframe>

<script>
  // Inject the chosen font into the iframe by overriding --font-body.
  // Lora for headings stays.
  function applyFont(font) {
    const frame = document.getElementById('frame');
    const doc = frame.contentDocument;
    if (!doc) return;
    const old = doc.getElementById('font-override');
    if (old) old.remove();
    // Inject the Google Fonts link too so the iframe can render it.
    const fontHrefs = {
      '"Source Sans 3", -apple-system, sans-serif': 'https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;500;600&display=swap',
      '"IBM Plex Sans", -apple-system, sans-serif': 'https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap',
      '"Lato", -apple-system, sans-serif': 'https://fonts.googleapis.com/css2?family=Lato:wght@400;500;700&display=swap',
      '"Atkinson Hyperlegible", -apple-system, sans-serif': 'https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap',
      '"Inter", -apple-system, sans-serif': 'https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap',
    };
    const link = fontHrefs[font];
    const oldLink = doc.getElementById('font-override-link');
    if (oldLink) oldLink.remove();
    if (link) {
      const l = doc.createElement('link');
      l.rel = 'stylesheet'; l.href = link; l.id = 'font-override-link';
      doc.head.appendChild(l);
    }
    const css = `:root { --font-body: ${font} !important; } body, p, li, dd, dt, button, input, textarea, select { font-family: ${font} !important; }`;
    const s = doc.createElement('style');
    s.id = 'font-override'; s.textContent = css;
    doc.head.appendChild(s);
  }

  document.querySelectorAll('.tab').forEach((btn) => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.tab').forEach((b) => b.classList.remove('is-active'));
      btn.classList.add('is-active');
      const font = btn.getAttribute('data-font');
      // 'Roboto' default = no override, just clear
      if (btn.textContent.includes('current')) {
        const frame = document.getElementById('frame');
        const doc = frame.contentDocument;
        doc.getElementById('font-override')?.remove();
        doc.getElementById('font-override-link')?.remove();
      } else {
        applyFont(font);
      }
    });
  });

  document.getElementById('open-tab').addEventListener('click', (e) => {
    e.preventDefault();
    window.open(document.getElementById('frame').src, '_blank');
  });
</script>
</body>
</html>
