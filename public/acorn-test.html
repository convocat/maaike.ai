<!DOCTYPE html>
<html><head><style>
body { margin: 0; display: grid; grid-template-columns: 1fr 1fr 1fr; }
.tile { display: flex; align-items: center; justify-content: center; min-height: 360px; }
.tile img { max-width: 280px; height: auto; }
.t1 { background: #FFFFFF; }
.t2 { background: #DDE6D0; }
.t3 { background: #2A332A; }
.label { position: absolute; bottom: 8px; left: 8px; font: 11px/1 system-ui; color: #555; background: #fff8; padding: 2px 6px; border-radius: 3px; }
.tile { position: relative; }
.t3 .label { background: #0008; color: #ddd; }
</style></head><body>
<div class="tile t1"><img src="/images/watercolor-acorn-trimmed.png" alt=""><span class="label">white</span></div>
<div class="tile t2"><img src="/images/watercolor-acorn-trimmed.png" alt=""><span class="label">moss</span></div>
<div class="tile t3"><img src="/images/watercolor-acorn-trimmed.png" alt=""><span class="label">dark</span></div>
</body></html>
