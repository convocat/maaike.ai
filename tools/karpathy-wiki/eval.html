<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eval dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;600;700&family=Roboto:wght@400;500&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
:root {
  --accent: #D6006C; --accent-h: #B0005A; --teal: #0D7C66;
  --bg: #FCFCFB; --card: #FAFAFA; --text: #1A1A1A; --muted: #6B6B6B;
  --border: #E5E5E5; --r: 0.5rem;
  --font-h: 'Lora', Georgia, serif;
  --font-b: 'Roboto', sans-serif;
  --font-m: 'JetBrains Mono', monospace;
  --s1-bg: #FFEBEE; --s1: #C62828;
  --s2-bg: #FFF8E1; --s2: #F57F17;
  --s3-bg: #E8F5E9; --s3: #2E7D32;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: var(--font-b); background: var(--bg); color: var(--text);
       display: flex; flex-direction: column; height: 100vh; overflow: hidden; font-size: 0.9rem; }

/* top bar */
#topbar { display: flex; align-items: center; gap: 0.75rem; padding: 0.55rem 1.25rem;
  background: var(--card); border-bottom: 1px solid var(--border); flex-shrink: 0; }
#topbar h1 { font-family: var(--font-h); font-size: 1rem; color: var(--accent); white-space: nowrap; }
#prog-text { font-size: 0.78rem; color: var(--muted); margin-left: auto; white-space: nowrap; }
#prog-wrap { width: 100px; height: 5px; background: var(--border); border-radius: 3px; flex-shrink: 0; }
#prog-bar  { height: 100%; background: var(--teal); border-radius: 3px; transition: width .3s; }
.tb-btn { padding: 0.35rem 0.85rem; border-radius: var(--r); font-size: 0.8rem; font-weight: 600;
  cursor: pointer; border: none; font-family: var(--font-b); }
#btn-run-all { background: var(--accent); color: #fff; }
#btn-run-all:hover { background: var(--accent-h); }
#btn-run-all:disabled { opacity: .5; cursor: not-allowed; }
#btn-export, #btn-report { background: var(--bg); border: 1px solid var(--border); color: var(--text); }
#btn-export:hover, #btn-report:hover { border-color: var(--teal); color: var(--teal); }

/* auto-eval badges (compact) */
#auto-row { display: flex; flex-wrap: wrap; gap: .35rem; margin-top: .35rem; }
.badge { font-size: .7rem; padding: .18rem .55rem; border-radius: 1rem; font-family: var(--font-m);
  display: inline-flex; align-items: center; gap: .25rem; }
.badge.pass { background: #e8f5e9; color: #2e7d32; }
.badge.fail { background: #ffebee; color: #c62828; }
.badge.warn { background: #fff8e1; color: #f57f17; }
.badge.neutral { background: #f0f0f0; color: var(--muted); }

/* Evaluation panel — the main insight surface */
#eval-panel {
  background: var(--card); border: 1px solid var(--border); border-radius: var(--r);
  padding: 1rem 1.25rem; display: flex; flex-direction: column; gap: 0.9rem;
}
.eval-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: .2rem; }
.eval-head .sec-head { margin: 0; }
.verdict {
  font-size: .72rem; padding: .2rem .7rem; border-radius: 1rem; font-weight: 700;
  text-transform: uppercase; letter-spacing: .05em; font-family: var(--font-b);
}
.verdict.pass { background: #c8e6c9; color: #1b5e20; }
.verdict.fail { background: #ffcdd2; color: #b71c1c; }
.verdict.warn { background: #ffe0b2; color: #e65100; }
.verdict.na   { background: var(--border); color: var(--muted); }

/* Tabular eval display */
table.eval-table { width: 100%; border-collapse: collapse; font-size: .82rem; }
table.eval-table th, table.eval-table td {
  text-align: left; padding: .38rem .75rem .38rem 0;
  border-bottom: 1px solid var(--border); vertical-align: top; line-height: 1.5;
}
table.eval-table th {
  font-weight: 600; font-size: .68rem; text-transform: uppercase; letter-spacing: .04em;
  color: var(--muted); white-space: nowrap; width: 150px;
}
table.eval-table td { color: var(--text); }
table.eval-table td code {
  font-family: var(--font-m); font-size: .77rem; background: transparent;
  color: var(--accent); padding: 0;
}
table.eval-table tr:last-child th, table.eval-table tr:last-child td { border-bottom: none; }

.status-txt { font-family: var(--font-m); font-size: .76rem; }
.status-txt.ok   { color: #2e7d32; }
.status-txt.bad  { color: #c62828; }
.status-txt.warn { color: #f57f17; }
.status-txt.neutral { color: var(--muted); }

.inline-list { font-family: var(--font-m); font-size: .77rem; line-height: 1.7; }
.inline-list .hit { color: #2e7d32; font-weight: 600; }
.inline-list .muted { color: var(--muted); }

/* Collapsible detail sections (triples, breakdown) */
details.eval-details { margin-top: .5rem; font-size: .82rem; }
details.eval-details summary {
  cursor: pointer; font-size: .7rem; text-transform: uppercase; letter-spacing: .04em;
  color: var(--muted); font-weight: 600; padding: .3rem 0;
  list-style: none;
}
details.eval-details summary::before { content: '▸ '; }
details.eval-details[open] summary::before { content: '▾ '; }
details.eval-details summary:hover { color: var(--accent); }
table.triples-table { width: 100%; border-collapse: collapse; font-size: .76rem; font-family: var(--font-m); margin-top: .3rem; }
table.triples-table th, table.triples-table td {
  text-align: left; padding: .25rem .55rem .25rem 0; border-bottom: 1px dotted var(--border);
}
table.triples-table th { font-weight: 600; color: var(--muted); font-size: .67rem; text-transform: uppercase; letter-spacing: .04em; }
table.triples-table .predicate { color: var(--teal); font-style: italic; }
table.triples-table .via-hop { color: var(--muted); font-style: italic; font-size: .72rem; }
table.breakdown-table { width: 100%; border-collapse: collapse; font-size: .76rem; font-family: var(--font-m); margin-top: .3rem; }
table.breakdown-table th, table.breakdown-table td {
  text-align: left; padding: .25rem .55rem .25rem 0; border-bottom: 1px dotted var(--border);
}
table.breakdown-table th { font-weight: 600; color: var(--muted); font-size: .67rem; text-transform: uppercase; letter-spacing: .04em; }
table.breakdown-table td.num { text-align: right; font-variant-numeric: tabular-nums; }
table.breakdown-table .total { font-weight: 600; color: var(--accent); }
table.breakdown-table tr.expected-row { background: #f0faf5; }

/* 3-column check table: CHECK | VALUE | STATUS */
table.check-table { width: 100%; border-collapse: collapse; font-size: .82rem; }
table.check-table th, table.check-table td {
  text-align: left; padding: .38rem .75rem .38rem 0;
  border-bottom: 1px solid var(--border); vertical-align: top; line-height: 1.45;
}
table.check-table th {
  font-weight: 600; font-size: .68rem; text-transform: uppercase; letter-spacing: .04em;
  color: var(--muted); white-space: nowrap;
}
table.check-table thead th { font-size: .65rem; }
table.check-table td.check-name { width: 170px; color: var(--muted); font-size: .78rem; font-weight: 500; }
table.check-table td.check-status { width: 80px; text-align: right; white-space: nowrap; }
table.check-table tr:last-child td { border-bottom: none; }

/* section wrappers */
.eval-section { margin-top: 1rem; }
.eval-section:first-child { margin-top: 0; }
.eval-section-head {
  font-size: .7rem; font-weight: 700; text-transform: uppercase; letter-spacing: .06em;
  color: var(--accent); padding-bottom: .3rem; margin-bottom: .4rem;
  border-bottom: 2px solid var(--accent);
}
.eval-section-sub {
  font-size: .7rem; color: var(--muted); margin: .8rem 0 .3rem;
  text-transform: uppercase; letter-spacing: .04em; font-weight: 600;
}
.stale-banner {
  background: #fff3e0; border: 1px solid #ffb74d; color: #e65100;
  padding: .55rem .8rem; border-radius: var(--r); font-size: .78rem; margin-bottom: .75rem;
}

/* Verification result rendering */
.claim-item {
  padding: .45rem .65rem; margin: .3rem 0; border-radius: 4px;
  font-size: .82rem; line-height: 1.5; border-left: 3px solid var(--border);
  background: var(--card);
}
.claim-item.verified   { border-left-color: #2e7d32; }
.claim-item.inferred   { border-left-color: #f57f17; }
.claim-item.unverified { border-left-color: #c62828; background: #fff5f5; }
.claim-quote {
  font-family: var(--font-m); font-size: .73rem; color: var(--muted);
  margin-top: .25rem; padding-left: .4rem; border-left: 2px solid var(--border);
  font-style: italic; line-height: 1.4;
}
.claim-src { font-size: .68rem; color: var(--accent); font-family: var(--font-m); }
.verify-summary {
  display: grid; grid-template-columns: repeat(4, 1fr); gap: .5rem;
  padding: .5rem 0 .75rem; text-align: center;
}
.vs-box {
  padding: .4rem .3rem; border-radius: 4px; border: 1px solid var(--border);
}
.vs-box .vs-n { font-size: 1.2rem; font-weight: 700; font-family: var(--font-m); }
.vs-box .vs-l { font-size: .65rem; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
.vs-box.verified   .vs-n { color: #2e7d32; }
.vs-box.inferred   .vs-n { color: #f57f17; }
.vs-box.unverified .vs-n { color: #c62828; }
.vs-verdict {
  font-size: .72rem; text-align: center; padding: .3rem; border-radius: 4px;
  margin-bottom: .5rem; font-weight: 600; text-transform: uppercase; letter-spacing: .05em;
}
.vs-verdict.grounded     { background: #e8f5e9; color: #1b5e20; }
.vs-verdict.mixed        { background: #fff8e1; color: #e65100; }
.vs-verdict.hallucinating{ background: #ffebee; color: #b71c1c; }
.vs-verdict.na           { background: #f0f0f0; color: var(--muted); }

.refused-banner {
  background: #e8f5e9; border: 1px solid #66bb6a; color: #1b5e20;
  padding: .55rem .8rem; border-radius: var(--r); font-size: .8rem; margin-bottom: .6rem;
}
.refused-banner strong { color: #1b5e20; }

/* Diagnosis block (auto from decision tree) */
.diag-box {
  background: var(--card); border: 1px solid var(--border);
  border-left: 4px solid; border-radius: var(--r);
  padding: .7rem .95rem; font-size: .87rem;
}
.diag-box.retrieval { border-left-color: #c62828; background: #fff5f5; }
.diag-box.prompt    { border-left-color: #f57f17; background: #fff9e6; }
.diag-box.grounding { border-left-color: #ab47bc; background: #faf0fc; }
.diag-box.tone      { border-left-color: #5c6bc0; background: #f3f4fb; }
.diag-box.healthy   { border-left-color: #2e7d32; background: #f0faf2; }
.diag-box.partial   { border-left-color: #6b6b6b; background: var(--card); }
.diag-head {
  font-family: var(--font-m); font-size: .68rem; font-weight: 700;
  text-transform: uppercase; letter-spacing: .06em; margin-bottom: .2rem;
}
.diag-box.retrieval .diag-head { color: #c62828; }
.diag-box.prompt    .diag-head { color: #e65100; }
.diag-box.grounding .diag-head { color: #7b1fa2; }
.diag-box.tone      .diag-head { color: #3f51b5; }
.diag-box.healthy   .diag-head { color: #2e7d32; }
.diag-box.partial   .diag-head { color: var(--muted); }
.diag-reason { font-size: .86rem; color: var(--text); margin: .2rem 0; line-height: 1.55; }
.diag-fix {
  font-size: .79rem; color: var(--muted); font-style: italic;
  margin-top: .4rem; padding-top: .35rem; border-top: 1px dashed var(--border);
}
.diag-fix strong { color: var(--text); font-style: normal; }

.verdict-reason {
  font-size: .78rem; color: var(--muted); font-style: italic;
  padding-top: .3rem; border-top: 1px dashed var(--border);
}

.no-debug-warn {
  background: #fff3e0; border: 1px solid #ffb74d; color: #e65100;
  padding: .6rem .9rem; border-radius: var(--r); font-size: .78rem; margin-top: .4rem;
}

/* Quality rubric — structured yes/no criteria */
#rubric-box { display: flex; flex-direction: column; gap: .65rem; }
.rubric-dim { border-top: 1px solid var(--border); padding-top: .5rem; }
.rubric-dim:first-child { border-top: none; padding-top: 0; }
.rubric-dim-name {
  font-size: .72rem; font-weight: 700; text-transform: uppercase; letter-spacing: .05em;
  color: var(--text); margin-bottom: .35rem;
}
.rubric-crit { display: grid; grid-template-columns: 1fr auto; gap: .5rem; align-items: center; padding: .15rem 0; }
.rubric-crit-label { font-size: .78rem; color: var(--text); line-height: 1.3; }
.rubric-crit-btns { display: flex; gap: .15rem; }
.rc-btn {
  width: 26px; height: 22px; border: 1px solid var(--border); background: var(--bg);
  border-radius: 3px; cursor: pointer; font-family: var(--font-m); font-size: .75rem;
  font-weight: 600; color: var(--muted); padding: 0; line-height: 1;
}
.rc-btn:hover { border-color: var(--accent); }
.rc-btn.active.pass { background: var(--teal); color: #fff; border-color: var(--teal); }
.rc-btn.active.fail { background: var(--s1); color: #fff; border-color: var(--s1); }
.rubric-summary {
  font-size: .72rem; color: var(--muted); text-align: center;
  padding-top: .4rem; border-top: 1px dashed var(--border);
}

/* modal */
#modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 100;
  display: none; align-items: flex-start; justify-content: center; padding: 2rem; overflow-y: auto; }
#modal-bg.show { display: flex; }
#modal { background: var(--bg); border-radius: var(--r); max-width: 820px; width: 100%;
  padding: 1.75rem 2rem; box-shadow: 0 8px 32px rgba(0,0,0,.15); }
#modal h2 { font-family: var(--font-h); font-size: 1.3rem; color: var(--accent); margin-bottom: .25rem; }
#modal h3 { font-family: var(--font-h); font-size: 1rem; color: var(--text); margin: 1.4rem 0 .5rem;
  padding-bottom: .3rem; border-bottom: 1px solid var(--border); }
#modal .meta { font-size: .8rem; color: var(--muted); margin-bottom: .5rem; }
#modal-close { float: right; background: none; border: none; font-size: 1.3rem; cursor: pointer; color: var(--muted); }
.criteria-grid { display: grid; grid-template-columns: auto 1fr auto; gap: .4rem 1rem; font-size: .85rem; align-items: baseline; }
.criteria-id { font-family: var(--font-m); font-size: .75rem; color: var(--muted); }
.criteria-status { font-size: .73rem; padding: .12rem .5rem; border-radius: 1rem; font-weight: 600; white-space: nowrap; }
.status-pass { background: #e8f5e9; color: #2e7d32; }
.status-fail { background: #ffebee; color: #c62828; }
.status-na   { background: #f0f0f0; color: var(--muted); }
.status-partial { background: #fff8e1; color: #f57f17; }
.fail-item { background: var(--card); border: 1px solid var(--border); border-radius: var(--r);
  padding: .7rem .9rem; margin-bottom: .5rem; font-size: .82rem; }
.fail-item .fq { font-weight: 600; margin-bottom: .25rem; }
.fail-item .diag { font-size: .76rem; color: var(--muted); }
.fail-item .fix { font-size: .76rem; color: var(--teal); margin-top: .3rem; font-style: italic; }
#wiki-url-wrap { display: flex; align-items: center; gap: 0.35rem; }
#wiki-url-wrap label { font-size: 0.75rem; color: var(--muted); white-space: nowrap; }
#wiki-url { padding: 0.3rem 0.5rem; border: 1px solid var(--border); border-radius: var(--r);
  font-size: 0.75rem; font-family: var(--font-m); width: 220px; background: var(--bg); color: var(--text); }
#health-dot {
  width: 10px; height: 10px; border-radius: 50%; background: var(--border);
  cursor: pointer; transition: background .2s;
}
#health-dot.ok   { background: #2e7d32; }
#health-dot.bad  { background: #c62828; }
#health-dot.stale{ background: #f57f17; }
#health-tip {
  position: absolute; background: #333; color: #fff; padding: .4rem .7rem;
  border-radius: var(--r); font-size: .72rem; font-family: var(--font-m);
  white-space: pre; z-index: 50; display: none; margin-top: 1.5rem; pointer-events: none;
}

/* layout */
#body { display: flex; flex: 1; overflow: hidden; }

/* sidebar */
#sidebar { width: 320px; min-width: 320px; background: var(--card);
  border-right: 1px solid var(--border); overflow-y: auto; }
.cat-label { font-size: 0.66rem; font-weight: 700; text-transform: uppercase; letter-spacing: .07em;
  color: var(--muted); padding: 0.65rem 0.85rem 0.25rem;
  display: flex; justify-content: space-between; }
.q-item { display: flex; align-items: flex-start; gap: 0.55rem;
  padding: 0.4rem 0.85rem; cursor: pointer; border-left: 3px solid transparent; }
.q-item:hover { background: #f0f0f0; }
.q-item.active { background: #f8e6f0; border-left-color: var(--accent); }
.q-num { font-size: 0.72rem; color: var(--muted); width: 22px; flex-shrink: 0;
  font-family: var(--font-m); line-height: 1.45; padding-top: 1px; }
.q-text { font-size: 0.82rem; line-height: 1.35; color: var(--text); flex: 1;
  overflow-wrap: break-word; hyphens: auto; }
.dot { margin-top: 5px; }
.dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; background: var(--border); }
.dot.run { background: #bdbdbd; }
.dot.s1  { background: var(--s1); }
.dot.s2  { background: var(--s2); }
.dot.s3  { background: var(--teal); }

/* center */
#center { flex: 1; overflow-y: auto; padding: 1.5rem 2rem; display: flex; flex-direction: column; gap: 1rem; min-width: 0; }
#empty { flex: 1; display: flex; align-items: center; justify-content: center; color: var(--muted); text-align: center; }
#detail { display: none; flex-direction: column; gap: 1rem; }
#q-meta { display: flex; align-items: baseline; gap: 0.6rem; }
#q-num-lbl { font-size: 0.73rem; color: var(--muted); font-family: var(--font-m); }
#q-cat-lbl { font-size: 0.62rem; font-weight: 700; text-transform: uppercase; letter-spacing: .05em;
  padding: 0.12rem 0.45rem; border-radius: 1rem; color: var(--muted); background: var(--border); }
#q-text-lbl { font-family: var(--font-h); font-size: 1.1rem; font-weight: 600; color: #111; line-height: 1.4; }
#q-src { font-size: 0.73rem; color: var(--muted); }
#q-src code { font-family: var(--font-m); background: #f0e6ec; color: var(--accent); padding: .1rem .3rem; border-radius: .2rem; }
.sec-head { font-size: 0.62rem; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin-bottom: .35rem; }
#answer-box { background: var(--card); border: 1px solid var(--border); border-radius: var(--r);
  padding: 1rem 1.25rem; line-height: 1.7; font-size: 0.87rem; min-height: 80px; white-space: pre-wrap; }
#answer-box.placeholder { color: var(--muted); font-style: italic; }
#sources-row { display: flex; flex-wrap: wrap; gap: .35rem; }
.chip { font-size: .72rem; padding: .18rem .55rem; border-radius: 1rem;
  background: #f0e6ec; color: var(--accent); font-family: var(--font-m); }
#debug-box { background: #f8f8f8; border: 1px solid var(--border); border-radius: var(--r);
  padding: .65rem 1rem; font-size: .73rem; font-family: var(--font-m); color: var(--muted); line-height: 1.6; }
#debug-box b { color: var(--text); }
#latency { font-size: .7rem; color: var(--muted); }

/* right panel */
#panel { width: 340px; min-width: 340px; border-left: 1px solid var(--border);
  padding: 1.1rem 1.1rem; display: flex; flex-direction: column; gap: 0.9rem; overflow-y: auto; }
#center { max-width: none; }
.p-label { font-size: .62rem; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin-bottom: .3rem; }
.score-btn { width: 100%; padding: .48rem; border-radius: var(--r); border: 2px solid transparent;
  font-size: .8rem; font-weight: 600; cursor: pointer; font-family: var(--font-b); text-align: left; transition: all .1s; }
.score-btn.s1 { background: var(--s1-bg); color: var(--s1); }
.score-btn.s2 { background: var(--s2-bg); color: var(--s2); }
.score-btn.s3 { background: var(--s3-bg); color: var(--s3); }
.score-btn.active { border-color: currentColor; box-shadow: 0 0 0 1px currentColor; }
#notes { width: 100%; min-height: 75px; padding: .45rem .55rem;
  border: 1px solid var(--border); border-radius: var(--r);
  font-family: var(--font-b); font-size: .8rem; resize: vertical; background: var(--bg); }
#notes:focus { outline: none; border-color: var(--accent); }
#btn-run { width: 100%; padding: .45rem; background: var(--accent); color: #fff;
  border: none; border-radius: var(--r); font-size: .82rem; font-weight: 600; cursor: pointer; font-family: var(--font-b); }
#btn-run:hover { background: var(--accent-h); }
#btn-run:disabled { opacity: .5; cursor: not-allowed; }
#save-msg { font-size: .7rem; color: var(--teal); text-align: center; min-height: .9rem; }
#nav-row { display: flex; gap: .4rem; }
.nav-btn { flex: 1; padding: .38rem; background: var(--bg); border: 1px solid var(--border);
  border-radius: var(--r); font-size: .78rem; cursor: pointer; font-family: var(--font-b); }
.nav-btn:hover { border-color: var(--teal); color: var(--teal); }
.nav-btn:disabled { opacity: .4; cursor: not-allowed; }
hr.divider { border: none; border-top: 1px solid var(--border); }
.stat-row { display: flex; justify-content: space-between; font-size: .76rem; padding: .12rem 0; }
.stat-lbl { color: var(--muted); }
.stat-val { font-weight: 600; }

/* spinner */
.spin { display: inline-block; width: 10px; height: 10px; border: 2px solid rgba(255,255,255,.4);
  border-top-color: #fff; border-radius: 50%; animation: sp .7s linear infinite; vertical-align: middle; margin-right: 4px; }
@keyframes sp { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div id="topbar">
  <h1>Eval dashboard</h1>
  <div id="wiki-url-wrap">
    <label>Wiki URL</label>
    <input id="wiki-url" value="http://localhost:8780" title="Base URL of the running wiki server" onchange="checkHealth()">
    <span id="health-dot" title="Checking..." onclick="checkHealth()"></span>
    <div id="health-tip"></div>
    <button id="btn-wiki-restart" onclick="restartWiki()" title="Kill and relaunch the wiki server. Dashboard stays up; health dot blinks red then green."
      style="background:none;border:1px solid var(--border);color:var(--muted);padding:.25rem .55rem;border-radius:var(--r);font-size:.7rem;cursor:pointer;font-family:var(--font-b);margin-left:.35rem">↻ Restart</button>
    <button id="btn-wiki-stop" onclick="stopWiki()" title="Stop the wiki server. You will need a shell to start it again."
      style="background:none;border:1px solid var(--border);color:var(--muted);padding:.25rem .55rem;border-radius:var(--r);font-size:.7rem;cursor:pointer;font-family:var(--font-b);margin-left:.25rem">■ Stop</button>
  </div>
  <span id="prog-text">0 / 55 scored</span>
  <div id="prog-wrap"><div id="prog-bar" style="width:0%"></div></div>
  <button class="tb-btn" id="btn-run-all" onclick="runAll()">Run all</button>
  <button class="tb-btn" id="btn-verify-all" onclick="verifyAll()" style="background:var(--teal);color:#fff">Verify all</button>
  <button class="tb-btn" id="btn-report" onclick="openReport()">Report</button>
  <button class="tb-btn" id="btn-export" onclick="exportJSON()">Export JSON</button>
  <button class="tb-btn" id="btn-reset" onclick="resetAll()" title="Backup + wipe all results" style="background:#fff;border:1px solid #c62828;color:#c62828">Start fresh</button>
</div>

<div id="modal-bg" onclick="if(event.target===this)closeReport()">
  <div id="modal">
    <button id="modal-close" onclick="closeReport()">&times;</button>
    <h2>Evaluation report</h2>
    <div class="meta" id="report-meta"></div>
    <div id="report-body"></div>
  </div>
</div>

<div id="body">
  <div id="sidebar"></div>

  <div id="center">
    <div id="empty">Select a question from the sidebar, or click <strong>Run all</strong> to begin.</div>
    <div id="detail">
      <div>
        <div id="q-meta"><span id="q-num-lbl"></span><span id="q-cat-lbl"></span></div>
        <div id="q-text-lbl" style="margin-top:.4rem"></div>
        <div id="q-src" style="margin-top:.3rem"></div>
      </div>
      <div>
        <div class="sec-head">Answer</div>
        <div id="answer-box" class="placeholder">Not run yet.</div>
      </div>
      <div id="eval-panel" style="display:none">
        <div class="eval-head">
          <div class="sec-head">Evaluation</div>
          <span id="verdict-pill" class="verdict na">awaiting data</span>
        </div>
        <div id="stale-banner" style="display:none"></div>
        <div id="eval-sections"></div>
        <div id="verdict-reason" class="verdict-reason" style="display:none"></div>
      </div>
    </div>
  </div>

  <div id="panel">
    <div>
      <div class="p-label">Score <span style="font-weight:400;color:var(--muted)">(keys 1/2/3)</span></div>
      <div style="display:flex;flex-direction:column;gap:.3rem">
        <button class="score-btn s1" id="sb1" onclick="score(1)">1 — Wrong / hallucinated</button>
        <button class="score-btn s2" id="sb2" onclick="score(2)">2 — Partial / vague</button>
        <button class="score-btn s3" id="sb3" onclick="score(3)">3 — Correct + sourced</button>
      </div>
    </div>
    <div>
      <div class="p-label">Quality rubric <span style="font-weight:400;color:var(--muted)">(✓ / ✗ / skip)</span></div>
      <div id="rubric-box"></div>
      <div id="rubric-summary" class="rubric-summary">No criteria rated yet</div>
    </div>
    <div>
      <div class="p-label">Notes</div>
      <textarea id="notes" placeholder="Observations…" onblur="saveNotes()"></textarea>
    </div>
    <button id="btn-run" onclick="runCurrent()">Run</button>
    <button id="btn-verify" onclick="verifyCurrent()" style="width:100%;padding:.45rem;background:var(--bg);border:1px solid var(--teal);color:var(--teal);border-radius:var(--r);font-size:.82rem;font-weight:600;cursor:pointer;font-family:var(--font-b)">Verify claims</button>
    <div id="save-msg"></div>
    <div id="nav-row">
      <button class="nav-btn" id="btn-prev" onclick="nav(-1)">&#8592; Prev</button>
      <button class="nav-btn" id="btn-next" onclick="nav(1)">Next &#8594;</button>
    </div>
    <hr class="divider">
    <div>
      <div class="p-label">Summary</div>
      <div id="stats"><span style="color:var(--muted);font-size:.76rem">No scores yet</span></div>
    </div>
  </div>
</div>
