name: Auto-tag backlog

# One-shot backlog enrichment across ALL collections. Manual trigger only.
# Walks articles, field-notes, seeds, jottings, experiments, weblinks, and
# runs /auto-tag on every post missing triples.

on:
  workflow_dispatch:
    inputs:
      max:
        description: 'Max posts to process this run (0 = no cap)'
        required: false
        default: '0'

permissions:
  contents: write

jobs:
  backlog:
    runs-on: ubuntu-latest
    timeout-minutes: 350  # 5h50 — close to GitHub's 6h ceiling
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          pip install requests pyyaml
          npm install -g @anthropic-ai/claude-code

      - name: Run auto-tag on backlog
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python scripts/run_auto_tag_on_drafts.py --scope all --max ${{ inputs.max }}

      - name: Commit changes
        run: |
          git config user.name "Maaike"
          git config user.email "maaikevanconvocat@gmail.com"
          git add src/content/ src/data/
          if ! git diff --staged --quiet; then
            git commit -m "Auto-tag backlog: $(date +'%Y-%m-%d')"
            git push
          fi
